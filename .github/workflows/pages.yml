name: Deploy briefing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'requirements-clouds.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Run application tests
        run: npm test
      - name: Check documentation links
        run: python3 scripts/check_docs.py
      - name: Refresh aviation report snapshot
        run: python3 scripts/update_aviation.py --output web/data/aviation.json
      - name: Refresh satellite snapshot
        run: python3 scripts/update_satellite.py --output web/data/satellite.json
      - name: Discover complete native cloud run
        id: cloud-run
        shell: bash
        run: |
          if cloud_run=$(python3 scripts/update_clouds.py --cache-key); then
            if [[ ! "$cloud_run" =~ ^icon-d2-ceiling-native-v[0-9]+-[0-9]{10}$ ]]; then
              echo 'Unexpected native cloud cache identifier' >&2
              exit 1
            fi
            printf 'run=%s\navailable=true\n' "$cloud_run" >> "$GITHUB_OUTPUT"
          else
            printf 'available=false\n' >> "$GITHUB_OUTPUT"
            echo '::warning::Native cloud run discovery failed; collector will publish an explicit stale or unavailable state.'
          fi
      - name: Restore native cloud run cache
        if: steps.cloud-run.outputs.available == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/clouds
          key: clouds-run-${{ steps.cloud-run.outputs.run }}-${{ hashFiles('scripts/update_clouds.py', 'requirements-clouds.txt') }}
      - name: Install isolated native GRIB decoder
        run: |
          python3 -m venv .venv-clouds
          .venv-clouds/bin/python -m pip install --disable-pip-version-check --requirement requirements-clouds.txt
      - name: Refresh native cloud diagnostic
        run: .venv-clouds/bin/python scripts/update_clouds.py --cache-dir .cache/clouds --output web/data/clouds.json
      - name: Build static site
        run: node scripts/build.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
